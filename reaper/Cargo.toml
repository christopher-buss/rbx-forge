[package]
name = "forge-reaper"
version = "0.0.0"
edition = "2024"
publish = false
description = "Process ownership for rbx-forge sessions: the forge-reaper binary and the @rbx-forge/native addon."
license = "MIT"

# The napi addon. `cdylib` only: the reaper binary never links napi symbols.
# No test target: a test executable cannot link the napi symbols that Node
# provides at load time. The logic lives in `src/os/`, and its tests run
# through the binary target, which compiles the same module tree.
[lib]
name = "forge_native"
crate-type = [ "cdylib" ]
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "forge-reaper"
path = "src/main.rs"

[dependencies]
napi = { version = "3.13.0", default-features = false, features = [ "napi6" ] }
napi-derive = "3.6.9"
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
napi-build = "2.5.0"

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"
