name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Knip
        run: pnpm knip

      - name: Unit
        run: pnpm test:unit

      - name: Integration
        run: pnpm test:integration

      - name: E2E
        run: pnpm test:e2e
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

  native:
    name: Native (${{ matrix.target }})
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          tools: node rust

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
        shell: bash

      - if: ${{ matrix.musl }}
        name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
        shell: bash

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-${{ matrix.target }}-${{ hashFiles('reaper/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            reaper/target
          restore-keys: cargo-${{ matrix.target }}-

      - if: ${{ matrix.checks }}
        name: Format
        run: cargo fmt --manifest-path reaper/Cargo.toml --check
        shell: bash

      - if: ${{ matrix.checks }}
        name: Clippy
        run: cargo clippy --manifest-path reaper/Cargo.toml --target ${{ matrix.target }} -- -D warnings
        shell: bash

      # A Node addon must link the C runtime dynamically; musl defaults to
      # static, so the addon build turns `crt-static` off.
      - name: Build addon
        run: pnpm build:native --target ${{ matrix.target }}
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.musl && '-C target-feature=-crt-static' || '' }}

      - name: Build reaper
        run: cargo build --manifest-path reaper/Cargo.toml --release --bin forge-reaper --target ${{ matrix.target }}
        shell: bash

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: |
            reaper/target/napi/*.node
            reaper/target/${{ matrix.target }}/release/forge-reaper
            reaper/target/${{ matrix.target }}/release/forge-reaper.exe
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
          - { host: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { checks: true, host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { host: ubuntu-latest, musl: true, target: x86_64-unknown-linux-musl }
          - { host: ubuntu-24.04-arm, musl: true, target: aarch64-unknown-linux-musl }
      fail-fast: false
