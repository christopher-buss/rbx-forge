name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  # Loads the addon given as the first argument and calls every export.
  LOAD_ADDON: >-
    const addon = require(require("node:path").resolve(process.argv[1]));
    const pinned = addon.pinProcess(process.pid);
    if (pinned.startTime !== addon.processStartTime(process.pid)) throw new Error("start time");
    const lock = addon.tryLockFile(require("node:os").tmpdir() + "/forge-load.lock", "exclusive");
    lock.release();
    console.log("forge-native", addon.nativeVersion(), process.platform, process.arch, pinned.executablePath());

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          tools: node rust

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('reaper/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            reaper/target
          restore-keys: cargo-check-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: pnpm build

      # Integration and e2e tests load the addon from `reaper/target/napi`.
      - name: Build native addon
        run: pnpm build:native

      - name: Native tests
        run: cargo test --manifest-path reaper/Cargo.toml

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Knip
        run: pnpm knip

      - name: Unit
        run: pnpm test:unit

      - name: Integration
        run: pnpm test:integration

      - name: E2E
        run: pnpm test:e2e
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

  native:
    name: Native (${{ matrix.target }})
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          tools: node rust

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
        shell: bash

      - if: ${{ matrix.musl }}
        name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
        shell: bash

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-${{ matrix.target }}-${{ hashFiles('reaper/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            reaper/target
          restore-keys: cargo-${{ matrix.target }}-

      - if: ${{ matrix.checks }}
        name: Format
        run: cargo fmt --manifest-path reaper/Cargo.toml --check
        shell: bash

      - if: ${{ matrix.checks }}
        name: Clippy
        run: cargo clippy --manifest-path reaper/Cargo.toml --target ${{ matrix.target }} -- -D warnings
        shell: bash

      # A Node addon must link the C runtime dynamically; musl defaults to
      # static, so the addon build turns `crt-static` off. The napi CLI picks
      # the cross linker `aarch64-linux-musl-gcc` for aarch64 musl, which
      # cannot find `libgcc_s` on a native arm64 host, so use the host `cc`
      # (the Rust default). For x86_64 musl the host `cc` links the glibc
      # loader into the addon (Alpine: "ld-linux-x86-64.so.2: No such
      # file"), so link with `musl-gcc` from musl-tools.
      - name: Build addon
        run: pnpm build:native --target ${{ matrix.target }}
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: cc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          RUSTFLAGS: ${{ matrix.musl && '-C target-feature=-crt-static' || '' }}

      - name: Build reaper
        run: cargo build --manifest-path reaper/Cargo.toml --release --bin forge-reaper --target ${{ matrix.target }}
        shell: bash

      # Load the addon in a Node of the target's platform and call it. musl
      # builds load in an Alpine container. x86_64-apple-darwin has no x64
      # Node on the arm64 runner.
      - if: ${{ matrix.load }}
        name: Load addon
        run: node -e "$LOAD" reaper/target/napi/*.node
        shell: bash
        env:
          LOAD: ${{ env.LOAD_ADDON }}

      - if: ${{ matrix.musl }}
        name: Load addon (Alpine)
        run: docker run --rm -v "$PWD/reaper/target/napi:/napi" -e LOAD node:24-alpine sh -c 'node -e "$LOAD" /napi/*.node'
        shell: bash
        env:
          LOAD: ${{ env.LOAD_ADDON }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: |
            reaper/target/napi/*.node
            reaper/target/${{ matrix.target }}/release/forge-reaper
            reaper/target/${{ matrix.target }}/release/forge-reaper.exe
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { host: windows-latest, load: true, target: x86_64-pc-windows-msvc }
          - { host: windows-11-arm, load: true, target: aarch64-pc-windows-msvc }
          - { host: macos-latest, load: true, target: aarch64-apple-darwin }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { checks: true, host: ubuntu-latest, load: true, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, load: true, target: aarch64-unknown-linux-gnu }
          - { host: ubuntu-latest, musl: true, target: x86_64-unknown-linux-musl }
          - { host: ubuntu-24.04-arm, musl: true, target: aarch64-unknown-linux-musl }
      fail-fast: false
