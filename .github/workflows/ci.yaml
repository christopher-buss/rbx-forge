name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `docs-only` is true only for a pull request that changes nothing but
  # Markdown and `docs/`; every other run builds and tests in full.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # A pull request checks out its merge commit, whose first parent is the
      # base branch.
      - id: diff
        if: github.event_name == 'pull_request'
        name: Find a docs-only change
        run: |
          files="$(git diff --name-only --no-renames HEAD^1 HEAD)"
          docs_only=true
          if grep -vE '\.md$|^docs/' <<< "$files" > /dev/null; then docs_only=false; fi
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"
        shell: bash
    timeout-minutes: 5

  check:
    name: Check (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          tools: node rust github:rojo-rbx/rojo luau

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('reaper/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            reaper/target
          restore-keys: cargo-check-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: pnpm build

      # Integration and e2e tests load the addon from `reaper/target/napi`.
      - name: Build native addon
        run: pnpm build:native

      # Next to the addon: integration and e2e tests run the real reaper.
      - name: Build reaper
        run: pnpm build:reaper

      - name: Native tests
        run: cargo test --manifest-path reaper/Cargo.toml

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Knip
        run: pnpm knip

      - name: Unit
        run: pnpm test:unit

      - name: Integration
        run: pnpm test:integration

      - name: E2E
        run: pnpm test:e2e
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs-only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # ESLint covers Markdown, with oxfmt and cspell.
      - name: Lint
        run: pnpm lint
    timeout-minutes: 10

  native:
    name: Native
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    uses: ./.github/workflows/native.yaml

  # IPC security: another local user is denied the control
  # channel. Needs a second local user, so it runs only here, never on a
  # developer machine.
  other-user:
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    name: Other user (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          tools: node rust

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('reaper/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            reaper/target
          restore-keys: cargo-check-${{ runner.os }}-${{ runner.arch }}-

      - name: Build native addon
        run: pnpm build:native

      - if: runner.os == 'Linux'
        name: Create a second local user (Linux)
        run: sudo useradd --no-create-home forge-other
        shell: bash

      - if: runner.os == 'macOS'
        name: Create a second local user (macOS)
        run: sudo sysadminctl -addUser forge-other -password "$(openssl rand -hex 16)"
        shell: bash

      - if: runner.os == 'Windows'
        name: Create a second local user (Windows)
        run: |
          # At most 14 characters: net user asks before it takes a longer one.
          $password = "Fo!" + [guid]::NewGuid().ToString("N").Substring(0, 8) + "aZ9"
          Write-Output "::add-mask::$password"
          net user forge-other $password /add
          "RBX_FORGE_OTHER_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        shell: pwsh

      - env:
          RBX_FORGE_OTHER_USER: forge-other
        name: Other user
        run: pnpm test:other-user
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 20
