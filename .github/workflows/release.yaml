name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  github-release:
    name: GitHub release
    needs: publish
    permissions:
      contents: write
      id-token: write
    uses: sxzz/workflows/.github/workflows/release.yml@80e37cd3ce8d7134be245dad263f10d2b51e0af1 # v1.3.0
    with:
      publish: false

  native:
    name: Native
    uses: ./.github/workflows/native.yaml

  # Platform packages first, then the root that names them as optional
  # dependencies; npm trusted publishing (OIDC), no token.
  publish:
    name: Publish
    permissions:
      contents: read
      id-token: write
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: reaper/target/artifacts
          pattern: native-*

      - name: Build
        run: pnpm build

      - name: Publish
        run: pnpm release:publish
    timeout-minutes: 15
