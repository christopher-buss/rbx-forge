autoInstallPeers: true
catalogMode: prefer
cleanupUnusedCatalogs: true
dedupePeers: true
enableGlobalVirtualStore: true
enablePrePostScripts: true
minimumReleaseAge: 1440 # 1 day

minimumReleaseAgeExclude:
  - "@isentinel/eslint-config"

minimumReleaseAgeExcludePrune: true

# The plugin's Jest runtime (plugin/test.project.json).
publicHoistPattern:
  - "@rbxts-js/*"
  - "@typescript/*"

saveExact: true
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080 # 7 days

updateConfig:
  ignoreDependencies:
    - typescript

packages:
  - plugin

overrides:
  "@typescript-eslint/eslint-plugin": 8.72.0
  "@typescript-eslint/parser": 8.72.0
  "@typescript-eslint/scope-manager": 8.72.0
  "@typescript-eslint/type-utils": 8.72.0
  "@typescript-eslint/types": 8.72.0
  "@typescript-eslint/typescript-estree": 8.72.0
  "@typescript-eslint/utils": 8.72.0

patchedDependencies:
  "@stryker-mutator/vitest-runner@10.0.0": patches/@stryker-mutator__vitest-runner@10.0.0.patch

catalogs:
  build:
    tsdown: 0.23.3
  lint:
    "@commitlint/cli": 21.2.4
    "@commitlint/config-conventional": 21.2.4
    "@commitlint/types": 21.2.3
    "@isentinel/eslint-config": 6.2.0
    "@vitest/eslint-plugin": 1.6.28
    eslint: 10.13.0
    eslint-plugin-jest: 29.17.0
    eslint-plugin-jest-extended: 3.0.1
    eslint-plugin-n: 18.5.0
    eslint-plugin-pnpm: 1.9.1
    eslint_d: 15.0.3
    knip: 6.43.0
    oxlint: 1.89.0
    oxlint-tsgolint: 7.0.2003
    publint: 0.3.25
  mutation:
    "@stryker-mutator/api": 10.0.0
    "@stryker-mutator/core": 10.0.0
    "@stryker-mutator/typescript-checker": 10.0.0
    "@stryker-mutator/vitest-runner": 10.0.0
  native:
    "@napi-rs/cli": 3.10.9
  plugin:
    "@isentinel/jest-roblox": 0.4.7
    "@isentinel/roblox-ts": 4.0.12
    "@rbxts/compiler-types": 3.0.0-types.0
    "@rbxts/jest": 3.16.0-ts.2
    "@rbxts/jest-globals": 3.16.0-ts.2
    "@rbxts/types": 1.0.960
  release:
    bumpp: 12.3.0
  runtime:
    "@msgpack/msgpack": 3.1.3
    arktype: 2.2.9
    c12: 4.0.0-rc.3
    jiti: 2.7.0
    strip-json-comments: 5.0.3
  test:
    "@total-typescript/shoehorn": 0.1.2
    "@vitest/coverage-v8": 5.0.5
    jest-extended: 7.0.0
    memfs: 4.80.0
    vitest: 5.0.5
  tsc:
    "@isentinel/tsconfig": 2.0.0
    "@typescript/native": npm:typescript@7.0.2
    better-typescript-lib: 2.12.0
    typescript: 6.0.3
  types:
    "@types/node": 26.6.5

allowBuilds:
  esbuild: true
  unrs-resolver: true
